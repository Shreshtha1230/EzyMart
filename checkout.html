<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EzyMart Pro | EzyPay Secure Checkout</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .checkout-grid {
            display: grid;
            grid-template-columns: 1.4fr 0.85fr;
            gap: 28px;
            align-items: start;
        }
        .step-card {
            padding: 26px;
            margin-bottom: 22px;
        }
        .step-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .step-head-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .step-num {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-glow);
        }
        .form-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .form-full { grid-column: 1 / -1; }
        .f-group label {
            display: block;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        /* EZYPAY GATEWAY TABS */
        .pay-methods {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .pay-tab {
            padding: 14px 10px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--glass);
            color: var(--text-muted);
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 12.5px;
            font-weight: 700;
        }
        .pay-tab i {
            display: block;
            font-size: 20px;
            margin-bottom: 6px;
        }
        .pay-tab.active, .pay-tab:hover {
            border-color: var(--primary-light);
            background: rgba(115, 87, 255, 0.16);
            color: var(--text);
            box-shadow: var(--shadow-glow);
        }

        /* 3D LIVE VIRTUAL CREDIT CARD */
        .virtual-card {
            max-width: 380px;
            margin: 0 auto 20px;
            padding: 22px 24px;
            border-radius: 20px;
            background: linear-gradient(135deg, #2b1972, #7357ff 52%, #d94fd8);
            color: #fff;
            box-shadow: 0 20px 45px rgba(115, 87, 255, 0.35);
            position: relative;
            overflow: hidden;
        }
        .virtual-card::after {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            top: -60px;
            right: -50px;
        }
        .vc-chip {
            width: 42px;
            height: 30px;
            border-radius: 7px;
            background: linear-gradient(135deg, #fde68a, #f59e0b);
            margin-bottom: 22px;
        }
        .vc-number {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 2.5px;
            margin-bottom: 22px;
            font-family: monospace;
        }
        .vc-bottom {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* UPI QR BOX */
        .upi-box {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 20px;
            align-items: center;
            padding: 18px;
            border-radius: 16px;
            background: var(--glass);
            border: 1px solid var(--border);
        }
        .qr-frame {
            background: #fff;
            padding: 10px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bank-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }
        .bank-btn {
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--glass);
            color: var(--text);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
        }
        .bank-btn.active {
            border-color: var(--primary-light);
            background: rgba(115, 87, 255, 0.22);
        }

        /* SPINNER */
        .spinner {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 4px solid rgba(115, 87, 255, 0.2);
            border-top-color: var(--primary-light);
            animation: spin 0.8s linear infinite;
            margin: 0 auto 18px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* INVOICE RECEIPT */
        .invoice-box {
            max-width: 720px;
            margin: 0 auto;
            padding: 36px;
        }
        .inv-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 13.5px;
        }
        .inv-table th, .inv-table td {
            padding: 10px 8px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }
        .inv-table th:last-child, .inv-table td:last-child { text-align: right; }

        @media (max-width: 920px) {
            .checkout-grid { grid-template-columns: 1fr; }
            .pay-methods { grid-template-columns: 1fr 1fr; }
            .form-grid-2 { grid-template-columns: 1fr; }
            .upi-box { grid-template-columns: 1fr; text-align: center; }
            .qr-frame { width: 150px; margin: 0 auto; }
        }
    </style>
</head>
<body>
    <div id="navbar-root"></div>

    <section class="page-hero no-print">
        <div class="container">
            <span class="section-tag"><i class="fa-solid fa-lock"></i> EZYPAY 256-BIT DEMO GATEWAY</span>
            <h1>Secure <span>Checkout</span></h1>
            <p>Complete your delivery details and pay seamlessly using UPI, Live 3D Card, Net Banking, or Cash on Delivery.</p>
        </div>
    </section>

    <main class="container" id="checkoutMain"></main>

    <!-- PAYMENT PROCESSING MODAL -->
    <div class="modal-backdrop" id="payProcessModal">
        <div class="modal-box" style="max-width:440px;text-align:center;padding:38px 28px;">
            <div class="spinner" id="paySpinner"></div>
            <div style="font-size:12px;font-weight:800;letter-spacing:2px;color:var(--primary-light);margin-bottom:8px;">EZYPAY SECURE GATEWAY</div>
            <h2 id="payStatusTitle" style="font-size:22px;font-weight:900;margin-bottom:8px;">Connecting to Gateway...</h2>
            <p id="payStatusDesc" style="color:var(--text-muted);font-size:13.5px;">Encrypting transaction & verifying payment method. Please do not close this tab.</p>
        </div>
    </div>

    <div id="footer-root"></div>

    <script src="app.js"></script>
    <script>
        renderSharedLayout("cart");

        let selectedPayMethod = "upi";
        let selectedBank = "SBI";
        let orderPricing = { subtotal: 0, discount: 0, shipping: 0, gst: 0, grandTotal: 0, promoCode: "" };

        function computePricing() {
            const cart = getCart();
            let subtotal = 0;
            cart.forEach(item => {
                const p = getProductById(item.id);
                if (p) subtotal += p.price * item.qty;
            });
            const promoCode = localStorage.getItem("ezymart_promo") || "";
            let discount = 0;
            if (promoCode && PROMO_CODES[promoCode]) {
                const rule = PROMO_CODES[promoCode];
                if (rule.type === "percent") discount = Math.round((subtotal * rule.value) / 100);
                else if (rule.type === "flat" && subtotal >= (rule.minSubtotal || 0)) discount = rule.value;
            }
            const afterDiscount = Math.max(0, subtotal - discount);
            const shipping = afterDiscount >= 1499 ? 0 : 99;
            const gst = Math.round(afterDiscount * 0.18);
            const grandTotal = afterDiscount + shipping + gst;
            orderPricing = { subtotal, discount, shipping, gst, grandTotal, promoCode };
            return orderPricing;
        }

        function renderCheckout() {
            const cart = getCart();
            const main = document.getElementById("checkoutMain");

            if (cart.length === 0) {
                main.innerHTML = `
                    <div class="glass-card" style="text-align:center;padding:60px 24px;max-width:580px;margin:0 auto;">
                        <i class="fa-solid fa-bag-shopping" style="font-size:48px;color:var(--primary-light);margin-bottom:14px;"></i>
                        <h2 style="font-size:24px;font-weight:900;margin-bottom:8px;">No Items to Checkout</h2>
                        <p style="color:var(--text-muted);margin-bottom:20px;">Add products to your cart before proceeding to EzyPay Checkout.</p>
                        <a href="product.html" class="btn btn-primary">Browse Store</a>
                    </div>
                `;
                return;
            }

            const p = computePricing();
            const user = getUser();
            const defaultName = user ? user.name : "";
            const defaultEmail = user ? user.email : "";

            const miniItems = cart.map(item => {
                const prod = getProductById(item.id);
                if (!prod) return "";
                return `
                    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13.5px;">
                        <div>
                            <strong>${prod.name}</strong>
                            <div style="font-size:12px;color:var(--text-muted);">${item.variant} × ${item.qty}</div>
                        </div>
                        <strong>${formatINR(prod.price * item.qty)}</strong>
                    </div>
                `;
            }).join("");

            main.innerHTML = `
                <div class="checkout-grid">
                    <div>
                        <!-- STEP 1: SHIPPING -->
                        <div class="glass-card step-card">
                            <div class="step-head">
                                <div class="step-head-left">
                                    <div class="step-num">1</div>
                                    <div>
                                        <h2 style="font-size:19px;font-weight:800;">Customer & Delivery Address</h2>
                                        <div style="font-size:12.5px;color:var(--text-muted);">Where should we ship your order?</div>
                                    </div>
                                </div>
                                <button type="button" class="btn btn-secondary btn-sm" onclick="autoFillDemo()">
                                    <i class="fa-solid fa-wand-magic-sparkles"></i> Auto-Fill Demo
                                </button>
                            </div>

                            <div class="form-grid-2">
                                <div class="f-group">
                                    <label>Full Name *</label>
                                    <input id="chkName" type="text" class="input-field" placeholder="e.g. Aarav Sharma" value="${defaultName}">
                                </div>
                                <div class="f-group">
                                    <label>Phone Number (10 digits) *</label>
                                    <input id="chkPhone" type="text" class="input-field" placeholder="9876543210" maxlength="10">
                                </div>
                                <div class="f-group form-full">
                                    <label>Email Address (for GST Invoice) *</label>
                                    <input id="chkEmail" type="text" class="input-field" placeholder="you@example.com" value="${defaultEmail}">
                                </div>
                                <div class="f-group form-full">
                                    <label>Street Address *</label>
                                    <input id="chkAddress" type="text" class="input-field" placeholder="House No., Sector, Landmark">
                                </div>
                                <div class="f-group">
                                    <label>City *</label>
                                    <input id="chkCity" type="text" class="input-field" placeholder="e.g. Ghaziabad">
                                </div>
                                <div class="f-group">
                                    <label>State *</label>
                                    <select id="chkState" class="select-field">
                                        <option value="">Select State</option>
                                        <option>Uttar Pradesh</option>
                                        <option>Delhi</option>
                                        <option>Haryana</option>
                                        <option>Maharashtra</option>
                                        <option>Karnataka</option>
                                        <option>Rajasthan</option>
                                        <option>Gujarat</option>
                                    </select>
                                </div>
                                <div class="f-group">
                                    <label>PIN Code (6 digits) *</label>
                                    <input id="chkPin" type="text" class="input-field" placeholder="201001" maxlength="6">
                                </div>
                            </div>
                        </div>

                        <!-- STEP 2: EZYPAY GATEWAY -->
                        <div class="glass-card step-card">
                            <div class="step-head">
                                <div class="step-head-left">
                                    <div class="step-num">2</div>
                                    <div>
                                        <h2 style="font-size:19px;font-weight:800;">EzyPay Payment Gateway</h2>
                                        <div style="font-size:12.5px;color:var(--text-muted);">Choose any payment method below</div>
                                    </div>
                                </div>
                                <span style="font-size:12px;color:var(--success);font-weight:700;"><i class="fa-solid fa-shield-halved"></i> Verified</span>
                            </div>

                            <div class="pay-methods">
                                <div class="pay-tab active" data-pay="upi" onclick="selectPayMethod('upi')">
                                    <i class="fa-solid fa-qrcode"></i> UPI / QR
                                </div>
                                <div class="pay-tab" data-pay="card" onclick="selectPayMethod('card')">
                                    <i class="fa-regular fa-credit-card"></i> Card
                                </div>
                                <div class="pay-tab" data-pay="netbanking" onclick="selectPayMethod('netbanking')">
                                    <i class="fa-solid fa-building-columns"></i> NetBanking
                                </div>
                                <div class="pay-tab" data-pay="cod" onclick="selectPayMethod('cod')">
                                    <i class="fa-solid fa-money-bill-wave"></i> Cash (COD)
                                </div>
                            </div>

                            <div id="payDetailsBox"></div>
                            <div id="checkoutError" class="form-error" style="margin-top:14px;font-size:13px;"></div>
                        </div>
                    </div>

                    <!-- ORDER SUMMARY -->
                    <aside class="glass-card" style="padding:26px;position:sticky;top:102px;">
                        <h2 style="font-size:20px;font-weight:900;margin-bottom:14px;">Order Summary</h2>
                        <div style="margin-bottom:16px;">${miniItems}</div>
                        <div style="display:flex;justify-content:space-between;font-size:14px;color:var(--text-muted);margin-bottom:8px;">
                            <span>Subtotal</span><strong style="color:var(--text);">${formatINR(p.subtotal)}</strong>
                        </div>
                        ${p.discount > 0 ? `
                            <div style="display:flex;justify-content:space-between;font-size:14px;color:var(--success);margin-bottom:8px;">
                                <span>Promo (${p.promoCode})</span><strong>- ${formatINR(p.discount)}</strong>
                            </div>
                        ` : ""}
                        <div style="display:flex;justify-content:space-between;font-size:14px;color:var(--text-muted);margin-bottom:8px;">
                            <span>Shipping</span><strong style="color:${p.shipping===0?'var(--success)':'var(--text)'};">${p.shipping===0?'FREE':formatINR(p.shipping)}</strong>
                        </div>
                        <div style="display:flex;justify-content:space-between;font-size:14px;color:var(--text-muted);margin-bottom:14px;">
                            <span>GST (18%)</span><strong style="color:var(--text);">${formatINR(p.gst)}</strong>
                        </div>
                        <div style="display:flex;justify-content:space-between;font-size:21px;font-weight:900;padding-top:14px;border-top:1px solid var(--border);margin-bottom:20px;">
                            <span>Payable Now</span><span>${formatINR(p.grandTotal)}</span>
                        </div>
                        <button class="btn btn-primary" style="width:100%;padding:15px;font-size:15px;" onclick="processPayment()">
                            <i class="fa-solid fa-lock"></i> Pay ${formatINR(p.grandTotal)} Now
                        </button>
                        <div style="text-align:center;font-size:12px;color:var(--text-muted);margin-top:12px;">
                            Instant GST Invoice & Live Order Tracking included
                        </div>
                    </aside>
                </div>
            `;

            renderPayPanel();
        }

        function selectPayMethod(method) {
            selectedPayMethod = method;
            document.querySelectorAll(".pay-tab").forEach(t => {
                t.classList.toggle("active", t.dataset.pay === method);
            });
            renderPayPanel();
        }

        function renderPayPanel() {
            const box = document.getElementById("payDetailsBox");
            if (!box) return;

            if (selectedPayMethod === "upi") {
                box.innerHTML = `
                    <div class="upi-box">
                        <div class="qr-frame">
                            <svg width="120" height="120" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                                <rect width="100" height="100" fill="#fff"/>
                                <rect x="6" y="6" width="26" height="26" fill="#111" rx="3"/>
                                <rect x="11" y="11" width="16" height="16" fill="#fff"/>
                                <rect x="15" y="15" width="8" height="8" fill="#7357ff"/>
                                <rect x="68" y="6" width="26" height="26" fill="#111" rx="3"/>
                                <rect x="73" y="11" width="16" height="16" fill="#fff"/>
                                <rect x="77" y="15" width="8" height="8" fill="#7357ff"/>
                                <rect x="6" y="68" width="26" height="26" fill="#111" rx="3"/>
                                <rect x="11" y="73" width="16" height="16" fill="#fff"/>
                                <rect x="15" y="77" width="8" height="8" fill="#7357ff"/>
                                <rect x="40" y="10" width="8" height="8" fill="#111"/>
                                <rect x="52" y="14" width="8" height="14" fill="#111"/>
                                <rect x="40" y="32" width="16" height="8" fill="#7357ff"/>
                                <rect x="12" y="42" width="16" height="8" fill="#111"/>
                                <rect x="34" y="46" width="10" height="16" fill="#111"/>
                                <rect x="52" y="44" width="14" height="12" fill="#111"/>
                                <rect x="72" y="42" width="18" height="8" fill="#111"/>
                                <rect x="48" y="66" width="10" height="10" fill="#7357ff"/>
                                <rect x="64" y="62" width="12" height="12" fill="#111"/>
                                <rect x="82" y="68" width="10" height="22" fill="#111"/>
                                <rect x="44" y="82" width="26" height="8" fill="#111"/>
                            </svg>
                        </div>
                        <div>
                            <div style="font-weight:800;font-size:15px;margin-bottom:6px;">Scan QR or Enter UPI ID</div>
                            <div style="font-size:12.5px;color:var(--text-muted);margin-bottom:12px;">Works with Google Pay, PhonePe, Paytm & BHIM UPI</div>
                            <input id="upiInput" type="text" class="input-field" placeholder="yourname@okaxis" value="student@okicici">
                            <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
                                <button type="button" class="btn btn-secondary btn-sm" onclick="document.getElementById('upiInput').value='aarav@okhdfcbank'">GPay</button>
                                <button type="button" class="btn btn-secondary btn-sm" onclick="document.getElementById('upiInput').value='aarav@ybl'">PhonePe</button>
                                <button type="button" class="btn btn-secondary btn-sm" onclick="document.getElementById('upiInput').value='aarav@paytm'">Paytm</button>
                            </div>
                        </div>
                    </div>
                `;
            } else if (selectedPayMethod === "card") {
                box.innerHTML = `
                    <div class="virtual-card">
                        <div style="display:flex;justify-content:space-between;align-items:center;">
                            <div class="vc-chip"></div>
                            <strong style="font-size:15px;letter-spacing:1px;">EZYPAY VISA</strong>
                        </div>
                        <div class="vc-number" id="vcNumPreview">4532 •••• •••• 8842</div>
                        <div class="vc-bottom">
                            <div><div style="opacity:0.7;font-size:9px;">Card Holder</div><strong id="vcNamePreview">AARAV SHARMA</strong></div>
                            <div><div style="opacity:0.7;font-size:9px;">Expires</div><strong id="vcExpPreview">08/29</strong></div>
                        </div>
                    </div>
                    <div class="form-grid-2">
                        <div class="f-group form-full">
                            <label>Card Number (16 digits)</label>
                            <input id="cardNumber" type="text" class="input-field" maxlength="19" placeholder="4532 1234 5678 8842" oninput="syncCardPreview()">
                        </div>
                        <div class="f-group form-full">
                            <label>Name on Card</label>
                            <input id="cardHolder" type="text" class="input-field" placeholder="Aarav Sharma" oninput="syncCardPreview()">
                        </div>
                        <div class="f-group">
                            <label>Expiry (MM/YY)</label>
                            <input id="cardExpiry" type="text" class="input-field" maxlength="5" placeholder="08/29" oninput="syncCardPreview()">
                        </div>
                        <div class="f-group">
                            <label>CVV (3 digits)</label>
                            <input id="cardCvv" type="password" class="input-field" maxlength="3" placeholder="123">
                        </div>
                    </div>
                `;
            } else if (selectedPayMethod === "netbanking") {
                const banks = ["SBI", "HDFC Bank", "ICICI Bank", "Axis Bank", "Kotak", "PNB"];
                box.innerHTML = `
                    <div style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">Select your bank for instant EzyPay NetBanking demo verification:</div>
                    <div class="bank-grid">
                        ${banks.map(b => `
                            <button type="button" class="bank-btn ${selectedBank === b ? 'active' : ''}" onclick="chooseBank('${b}')">
                                <i class="fa-solid fa-building-columns" style="color:var(--primary-light);margin-right:6px;"></i> ${b}
                            </button>
                        `).join("")}
                    </div>
                `;
            } else {
                box.innerHTML = `
                    <div style="padding:18px;border-radius:16px;background:rgba(16,185,129,0.10);border:1px solid rgba(16,185,129,0.35);display:flex;align-items:center;gap:14px;">
                        <i class="fa-solid fa-money-bill-wave" style="font-size:28px;color:var(--success);"></i>
                        <div>
                            <strong style="display:block;">Cash / UPI on Delivery</strong>
                            <span style="font-size:13px;color:var(--text-muted);">Pay ${formatINR(orderPricing.grandTotal)} in cash or via UPI when our delivery partner arrives at your doorstep.</span>
                        </div>
                    </div>
                `;
            }
        }

        function chooseBank(bank) {
            selectedBank = bank;
            renderPayPanel();
        }

        function syncCardPreview() {
            const raw = cleanDigits(document.getElementById("cardNumber").value).slice(0, 16);
            let grouped = "";
            for (let i = 0; i < raw.length; i++) {
                if (i > 0 && i % 4 === 0) grouped += " ";
                grouped += raw[i];
            }
            document.getElementById("cardNumber").value = grouped;
            document.getElementById("vcNumPreview").textContent = grouped || "4532 •••• •••• 8842";

            const holder = document.getElementById("cardHolder").value.trim().toUpperCase();
            document.getElementById("vcNamePreview").textContent = holder || "AARAV SHARMA";

            const exp = document.getElementById("cardExpiry").value.trim();
            document.getElementById("vcExpPreview").textContent = exp || "08/29";
        }

        function autoFillDemo() {
            document.getElementById("chkName").value = "Aarav Sharma";
            document.getElementById("chkPhone").value = "9876543210";
            document.getElementById("chkEmail").value = "aarav.sharma@ezymart.in";
            document.getElementById("chkAddress").value = "B-42, Knowledge Park III, Greater Noida";
            document.getElementById("chkCity").value = "Greater Noida";
            document.getElementById("chkState").value = "Uttar Pradesh";
            document.getElementById("chkPin").value = "201306";
            showToast("Demo delivery details filled!", "info");
        }

        function showCheckoutError(msg) {
            const err = document.getElementById("checkoutError");
            err.textContent = msg;
            err.classList.add("show");
            showToast(msg, "error");
        }

        function processPayment() {
            const err = document.getElementById("checkoutError");
            err.classList.remove("show");

            // Explicit validation (NO regex)
            const name = document.getElementById("chkName").value.trim();
            const phone = document.getElementById("chkPhone").value.trim();
            const email = document.getElementById("chkEmail").value.trim();
            const address = document.getElementById("chkAddress").value.trim();
            const city = document.getElementById("chkCity").value.trim();
            const state = document.getElementById("chkState").value;
            const pin = document.getElementById("chkPin").value.trim();

            if (name.length < 2) return showCheckoutError("Please enter your full name.");
            if (phone.length !== 10 || !isAllDigits(phone)) return showCheckoutError("Phone number must be exactly 10 digits.");
            if (!isValidEmailSimple(email)) return showCheckoutError("Please enter a valid email address.");
            if (address.length < 5) return showCheckoutError("Please enter your complete street address.");
            if (city.length < 2) return showCheckoutError("Please enter your city.");
            if (!state) return showCheckoutError("Please select your state.");
            if (pin.length !== 6 || !isAllDigits(pin)) return showCheckoutError("PIN code must be exactly 6 digits.");

            let paymentLabel = "Cash on Delivery";
            if (selectedPayMethod === "upi") {
                const upi = document.getElementById("upiInput").value.trim();
                if (!upi.includes("@") || upi.length < 5) return showCheckoutError("Enter a valid UPI ID (e.g. name@okicici).");
                paymentLabel = `UPI (${upi})`;
            } else if (selectedPayMethod === "card") {
                const num = cleanDigits(document.getElementById("cardNumber").value);
                const holder = document.getElementById("cardHolder").value.trim();
                const exp = document.getElementById("cardExpiry").value.trim();
                const cvv = document.getElementById("cardCvv").value.trim();
                if (num.length !== 16) return showCheckoutError("Card number must be 16 digits.");
                if (holder.length < 2) return showCheckoutError("Please enter the cardholder name.");
                if (exp.length !== 5 || !exp.includes("/")) return showCheckoutError("Expiry must be in MM/YY format.");
                if (cvv.length !== 3 || !isAllDigits(cvv)) return showCheckoutError("CVV must be 3 digits.");
                paymentLabel = `Card (•••• ${num.slice(-4)})`;
            } else if (selectedPayMethod === "netbanking") {
                paymentLabel = `NetBanking (${selectedBank})`;
            }

            // Open simulated EzyPay gateway modal
            const modal = document.getElementById("payProcessModal");
            const title = document.getElementById("payStatusTitle");
            const desc = document.getElementById("payStatusDesc");
            modal.classList.add("open");
            title.textContent = "Connecting to EzyPay...";
            desc.textContent = `Authorizing ${formatINR(orderPricing.grandTotal)} via ${paymentLabel}`;

            setTimeout(() => {
                title.textContent = "Verifying Transaction...";
                desc.textContent = "Generating Order ID and digital GST invoice...";
            }, 900);

            setTimeout(() => {
                modal.classList.remove("open");
                finalizeOrder({ name, phone, email, address, city, state, pin }, paymentLabel);
            }, 2000);
        }

        function finalizeOrder(customer, paymentLabel) {
            const cart = getCart();
            const items = cart.map(item => {
                const prod = getProductById(item.id);
                return {
                    id: item.id,
                    name: prod.name,
                    variant: item.variant,
                    qty: item.qty,
                    price: prod.price
                };
            });

            const randNum = Math.floor(1000 + Math.random() * 9000);
            const order = {
                orderId: `EZY-2026-${randNum}`,
                txnId: `TXN${Date.now().toString().slice(-8)}`,
                date: new Date().toLocaleString("en-IN"),
                statusStep: 1, // 1=Confirmed, 2=Packed, 3=Shipped, 4=Delivered
                customer,
                paymentLabel,
                items,
                pricing: { ...orderPricing }
            };

            const orders = getOrders();
            orders.unshift(order);
            saveOrders(orders);

            saveCart([]);
            localStorage.removeItem("ezymart_promo");
            showToast(`Order ${order.orderId} confirmed!`, "success");
            renderSuccessInvoice(order);
        }

        function renderSuccessInvoice(order) {
            const main = document.getElementById("checkoutMain");
            main.innerHTML = `
                <div class="glass-card invoice-box">
                    <div style="text-align:center;margin-bottom:26px;" class="no-print">
                        <div style="width:68px;height:68px;border-radius:50%;background:rgba(16,185,129,0.16);color:var(--success);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 12px;">
                            <i class="fa-solid fa-circle-check"></i>
                        </div>
                        <span class="section-tag">PAYMENT SUCCESSFUL</span>
                        <h1 style="font-size:30px;font-weight:900;margin-bottom:6px;">Thank You, ${order.customer.name}!</h1>
                        <p style="color:var(--text-muted);font-size:14px;">Your order has been placed and saved to your Order History.</p>
                    </div>

                    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;padding-bottom:18px;border-bottom:1px solid var(--border);">
                        <div>
                            <div style="font-size:20px;font-weight:900;">EZY<span style="color:var(--primary-light);">MART</span> TAX INVOICE</div>
                            <div style="font-size:12.5px;color:var(--text-muted);">Order ID: <strong>${order.orderId}</strong> • Txn: ${order.txnId}</div>
                            <div style="font-size:12.5px;color:var(--text-muted);">Date: ${order.date}</div>
                        </div>
                        <div style="text-align:right;font-size:12.5px;color:var(--text-muted);">
                            <strong style="color:var(--text);display:block;">Billed To: ${order.customer.name}</strong>
                            ${order.customer.address}, ${order.customer.city}<br>
                            ${order.customer.state} - ${order.customer.pin} • ${order.customer.phone}
                        </div>
                    </div>

                    <table class="inv-table">
                        <thead>
                            <tr><th>Item</th><th>Option</th><th>Qty</th><th>Amount</th></tr>
                        </thead>
                        <tbody>
                            ${order.items.map(i => `
                                <tr>
                                    <td><strong>${i.name}</strong></td>
                                    <td>${i.variant}</td>
                                    <td>${i.qty}</td>
                                    <td>${formatINR(i.price * i.qty)}</td>
                                </tr>
                            `).join("")}
                        </tbody>
                    </table>

                    <div style="max-width:300px;margin-left:auto;font-size:14px;">
                        <div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span>Subtotal</span><span>${formatINR(order.pricing.subtotal)}</span></div>
                        ${order.pricing.discount > 0 ? `<div style="display:flex;justify-content:space-between;margin-bottom:6px;color:var(--success);"><span>Discount</span><span>- ${formatINR(order.pricing.discount)}</span></div>` : ""}
                        <div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span>Shipping</span><span>${order.pricing.shipping===0?'FREE':formatINR(order.pricing.shipping)}</span></div>
                        <div style="display:flex;justify-content:space-between;margin-bottom:10px;"><span>GST (18%)</span><span>${formatINR(order.pricing.gst)}</span></div>
                        <div style="display:flex;justify-content:space-between;font-size:18px;font-weight:900;padding-top:10px;border-top:1px solid var(--border);">
                            <span>Total Paid</span><span>${formatINR(order.pricing.grandTotal)}</span>
                        </div>
                        <div style="font-size:12px;color:var(--text-muted);text-align:right;margin-top:6px;">Paid via ${order.paymentLabel}</div>
                    </div>

                    <div class="no-print" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px;">
                        <button class="btn btn-primary" onclick="window.print()"><i class="fa-solid fa-print"></i> Print / Save PDF Invoice</button>
                        <a href="orders.html" class="btn btn-secondary"><i class="fa-solid fa-truck-fast"></i> Track Order Live</a>
                        <a href="product.html" class="btn btn-secondary"><i class="fa-solid fa-store"></i> Continue Shopping</a>
                    </div>
                </div>
            `;
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        renderCheckout();
    </script>
</body>
</html>
