
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EazyCart | Checkout</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Checkout CSS -->
    <link rel="stylesheet" href="checkout.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->
    <nav class="navbar">

        <a href="index.html" class="logo">
            <i class="fa-solid fa-bag-shopping"></i>
            <span>EazyCart</span>
        </a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#categories">Categories</a>
            <a href="products.html">Products</a>
        </div>

        <a href="cart.html" class="cart-nav">
            <i class="fa-solid fa-cart-shopping"></i>
            <span>Cart</span>
            <b>2</b>
        </a>

    </nav>


    <!-- ================= CHECKOUT ================= -->
    <main class="checkout-page">

        <div class="checkout-header">
            <span class="small-title">EAZYCART</span>
            <h1>Checkout</h1>
            <p>Complete your order securely and easily.</p>
        </div>


        <div class="checkout-container">

            <!-- ================= LEFT SIDE ================= -->
            <section class="checkout-left">

                <!-- Customer Information -->
                <div class="checkout-card">

                    <div class="card-title">
                        <div class="title-icon">
                            <i class="fa-solid fa-user"></i>
                        </div>

                        <div>
                            <h2>Customer Information</h2>
                            <p>Enter your contact details</p>
                        </div>
                    </div>

                    <div class="form-grid">

                        <div class="form-group">
                            <label>First Name</label>
                            <input type="text" placeholder="Enter first name">
                        </div>

                        <div class="form-group">
                            <label>Last Name</label>
                            <input type="text" placeholder="Enter last name">
                        </div>

                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" placeholder="Enter email address">
                        </div>

                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="tel" placeholder="Enter phone number">
                        </div>

                    </div>

                </div>


                <!-- Delivery Address -->
                <div class="checkout-card">

                    <div class="card-title">
                        <div class="title-icon">
                            <i class="fa-solid fa-location-dot"></i>
                        </div>

                        <div>
                            <h2>Delivery Address</h2>
                            <p>Where should we deliver your order?</p>
                        </div>
                    </div>

                    <div class="form-grid">

                        <div class="form-group full">
                            <label>Address</label>
                            <input type="text" placeholder="House no., street, area">
                        </div>

                        <div class="form-group">
                            <label>City</label>
                            <input type="text" placeholder="Enter city">
                        </div>

                        <div class="form-group">
                            <label>State</label>
                            <select>
                                <option>Select State</option>
                                <option>Uttar Pradesh</option>
                                <option>Delhi</option>
                                <option>Haryana</option>
                                <option>Maharashtra</option>
                                <option>Rajasthan</option>
                                <option>Madhya Pradesh</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>PIN Code</label>
                            <input type="text" placeholder="6-digit PIN">
                        </div>

                    </div>

                </div>


                <!-- Payment Method -->
                <div class="checkout-card">

                    <div class="card-title">
                        <div class="title-icon">
                            <i class="fa-solid fa-credit-card"></i>
                        </div>

                        <div>
                            <h2>Payment Method</h2>
                            <p>Select your preferred payment option</p>
                        </div>
                    </div>


                    <div class="payment-options">

                        <label class="payment-option active">
